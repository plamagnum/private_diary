version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: diary_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: diary
      MYSQL_USER: diary_user
      MYSQL_PASSWORD: diary_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"          # не конфліктує з локальним MySQL

  php:
    build: ./php
    container_name: diary_php
    restart: unless-stopped
    volumes:
      - ./php:/var/www/html
      - ./public:/var/www/html/public
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: diary
      DB_USER: diary_user
      DB_PASS: diary_pass

  nginx:
    image: nginx:alpine
    container_name: diary_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - php

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: diary_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpass
    ports:
      - "8086:80"
    depends_on:
      - db

volumes:
  db_data:
