services:
  db:
    image: mysql:8.0
    container_name: diary_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: diary
      MYSQL_USER: ${DB_USER:-diary_user}
      MYSQL_PASSWORD: ${DB_PASS:?set in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:3307:3306"   # лише локально

  php:
    build: ./php
    container_name: diary_php
    restart: unless-stopped
    volumes:
      - ./php:/var/www/html
      - ./public:/var/www/html/public
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: diary
      DB_USER: ${DB_USER:-diary_user}
      DB_PASS: ${DB_PASS:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}

  nginx:
    image: nginx:alpine
    container_name: diary_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - php

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: diary_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8086:80"
    depends_on:
      - db

volumes:
  db_data:
